<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020617" />
  <meta name="color-scheme" content="dark light" />
  <meta name="author" content="Eslam Ayman" />
  <meta name="description" content="Eslam Ayman — Full-Stack Web Developer specializing in Angular, React.js, Node.js, Express.js, MongoDB, REST APIs, and modern responsive web applications." />
  <title>Eslam Ayman | Full-Stack Web Developer</title>
  <link rel="icon" href="/favicon.ico" />
  <script>
    try {
      const saved = localStorage.getItem("theme");
      const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
      if (saved === "dark" || (!saved && !prefersLight)) document.documentElement.classList.add("dark");
    } catch {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
